# Scopes off UGOS's vendor-wide /etc/ssh/force_command.sh (set via the
# unconditional `ForceCommand` in /etc/ssh/sshd_config) for the Jarvis
# service account only. That wrapper ignores authorized_keys `command=`
# restrictions entirely: admin/root-group logins get an arbitrary shell,
# everyone else is limited to rsync/scp/sftp-server. Neither behavior is
# what the restricted recovery/status keys need. sshd resolves each
# keyword to the first value obtained for a given connection, and a
# Match block's directives are only "obtained" for connections that
# satisfy it, so this line has no effect on Nick or any other account.
Match User Jarvis
    ForceCommand none

# Close the block explicitly. sshd_config.d/*.conf files are included in
# alphabetical order and a Match block's scope otherwise runs to EOF of the
# merged config, so without this, any plain directive in a later-sorted
# drop-in (e.g. low_crypt.conf, middle_crypt.conf) would be silently
# trapped inside "Match User Jarvis" and stop applying to everyone else.
Match all
